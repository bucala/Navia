<!-- menu_decks — two overlapping cards. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="icoBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c07a"/>
      <stop offset="100%" stop-color="#9c6b2e"/>
    </linearGradient>
    <linearGradient id="icoFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe58a"/>
      <stop offset="45%" stop-color="#f6a723"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect x="14" y="10" width="20" height="27" rx="2.5" fill="#2c2013" stroke="url(#icoBronze)" stroke-width="1.6" transform="rotate(-8 24 24)"/>
  <rect x="14" y="10" width="20" height="27" rx="2.5" fill="#1e1610" stroke="url(#icoBronze)" stroke-width="2" transform="rotate(8 24 24)"/>
  <circle cx="24" cy="24" r="4.5" fill="url(#icoFire)" transform="rotate(8 24 24)"/>
</svg>
