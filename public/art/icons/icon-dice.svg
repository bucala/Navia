<!-- Dice roll — echoes the 3D die-scene face already used in-game. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="icoBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c07a"/>
      <stop offset="100%" stop-color="#9c6b2e"/>
    </linearGradient>
    <linearGradient id="icoFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe58a"/>
      <stop offset="45%" stop-color="#f6a723"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="34" height="34" rx="6" fill="#2c2013" stroke="url(#icoBronze)" stroke-width="2.6"/>
  <g fill="url(#icoFire)">
    <circle cx="16" cy="16" r="3"/>
    <circle cx="32" cy="16" r="3"/>
    <circle cx="24" cy="24" r="3"/>
    <circle cx="16" cy="32" r="3"/>
    <circle cx="32" cy="32" r="3"/>
  </g>
</svg>
