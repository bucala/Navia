<!--
  Unified card back (rub karty) — stone plaque, bronze double frame, rune
  lattice and the glowing Navia "N" medallion. 5:7 like every card face.
  Used by CardBack.tsx for the hand flip, the opponent's hand and the Codex.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
  <defs>
    <radialGradient id="cbStone" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3f2f1f"/>
      <stop offset="55%" stop-color="#241b13"/>
      <stop offset="100%" stop-color="#110c07"/>
    </radialGradient>
    <linearGradient id="cbBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c07a"/>
      <stop offset="50%" stop-color="#b8863f"/>
      <stop offset="100%" stop-color="#9c6b2e"/>
    </linearGradient>
    <linearGradient id="cbFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe58a"/>
      <stop offset="45%" stop-color="#f6a723"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="cbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6a723" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cbLattice" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 20 H40 M20 0 V40" stroke="#c9a15a" stroke-width="1" opacity="0.13"/>
    </pattern>
    <filter id="cbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="cbCorner">
      <path d="M0 70 V18 Q0 0 18 0 H70" fill="none" stroke="url(#cbBronze)" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 46 C 26 46, 46 26, 46 0" fill="none" stroke="url(#cbBronze)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <circle cx="16" cy="16" r="6" fill="url(#cbFire)"/>
    </g>
  </defs>

  <!-- Stone plaque with rune lattice -->
  <rect width="500" height="700" rx="34" fill="url(#cbStone)"/>
  <rect x="22" y="22" width="456" height="656" rx="22" fill="url(#cbLattice)"/>

  <!-- Bronze double frame -->
  <rect x="10" y="10" width="480" height="680" rx="28" fill="none" stroke="url(#cbBronze)" stroke-width="8"/>
  <rect x="26" y="26" width="448" height="648" rx="18" fill="none" stroke="#000" stroke-width="3" opacity="0.5"/>
  <rect x="32" y="32" width="436" height="636" rx="16" fill="none" stroke="url(#cbBronze)" stroke-width="2" opacity="0.7"/>

  <!-- Corner flourishes -->
  <use href="#cbCorner" transform="translate(44 44)"/>
  <use href="#cbCorner" transform="translate(456 44) scale(-1 1)"/>
  <use href="#cbCorner" transform="translate(44 656) scale(1 -1)"/>
  <use href="#cbCorner" transform="translate(456 656) scale(-1 -1)"/>

  <!-- Mana gems top and bottom -->
  <g fill="url(#cbFire)" stroke="#3a2a18" stroke-width="2">
    <rect x="238" y="58" width="24" height="24" rx="3" transform="rotate(45 250 70)"/>
    <rect x="238" y="618" width="24" height="24" rx="3" transform="rotate(45 250 630)"/>
  </g>
  <g stroke="url(#cbBronze)" stroke-width="2" opacity="0.7">
    <line x1="120" y1="70" x2="222" y2="70"/>
    <line x1="278" y1="70" x2="380" y2="70"/>
    <line x1="120" y1="630" x2="222" y2="630"/>
    <line x1="278" y1="630" x2="380" y2="630"/>
  </g>

  <!-- Central medallion -->
  <circle cx="250" cy="350" r="170" fill="url(#cbHalo)"/>
  <circle cx="250" cy="350" r="128" fill="#1a1108" stroke="url(#cbBronze)" stroke-width="9"/>
  <circle cx="250" cy="350" r="110" fill="none" stroke="#000" stroke-width="3" opacity="0.45"/>
  <circle cx="250" cy="350" r="146" fill="none" stroke="url(#cbBronze)" stroke-width="2" stroke-dasharray="4 10" opacity="0.8"/>
  <g stroke="#c9a15a" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="250" y1="196" x2="250" y2="214"/>
    <line x1="250" y1="486" x2="250" y2="504"/>
    <line x1="96" y1="350" x2="114" y2="350"/>
    <line x1="386" y1="350" x2="404" y2="350"/>
    <line x1="141" y1="241" x2="154" y2="254"/>
    <line x1="359" y1="241" x2="346" y2="254"/>
    <line x1="141" y1="459" x2="154" y2="446"/>
    <line x1="359" y1="459" x2="346" y2="446"/>
  </g>

  <!-- Rune "N" monogram, glowing (same glyph as the app mark) -->
  <g filter="url(#cbGlow)" transform="translate(250 352) scale(0.62) translate(-256 -256)">
    <path d="M176 356 L176 156 L216 156 L296 296 L296 156 L336 156 L336 356 L296 356 L216 216 L216 356 Z"
      fill="#1a1108" stroke="#1a1108" stroke-width="18" stroke-linejoin="round"/>
    <path d="M176 356 L176 156 L216 156 L296 296 L296 156 L336 156 L336 356 L296 356 L216 216 L216 356 Z"
      fill="url(#cbFire)"/>
  </g>
</svg>
